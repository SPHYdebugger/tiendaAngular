<div class="colores">
    <h2 [style.color]="colorActual">¡Cambia mi color!</h2>

    <button (click)="cambiarColor('red')" style="color: red;">🔴 Rojo</button>
    <button (click)="cambiarColor('blue')" style="color: blue;">🔵 Azul</button>
    <button (click)="cambiarColor('green')" style="color: green;">🟢 Verde</button>
    <button (click)="cambiarColor('black')" style="color: black;">⚫ Negro</button>
</div>
